<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozzy — Yu'ki MMA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E31C1C' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mat:#0A0A0B;
    --raised:#141417;
    --raised-2:#1B1B1F;
    --chalk:#F6F5F2;
    --steel:#85888F;
    --line:rgba(246,245,242,.10);
    --accent:#E31C1C;
    --accent-soft:rgba(227,28,28,.14);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--mat);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    line-height:1.5;
  }
  ::selection{background:var(--accent);color:#0A0A0B}
  a{color:inherit}

  .wrap{max-width:1040px;margin:0 auto;padding:0 28px}
  .section{padding:108px 0}

  .mono{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--steel);
  }

  .eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .eyebrow .dash{height:1px;width:42px;background:var(--accent)}

  .section-title{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    line-height:.94;letter-spacing:.005em;font-size:clamp(2.4rem,6.5vw,4.4rem);
  }
  .lede{max-width:46ch;margin-top:18px;font-size:1.06rem;color:#D3D2CD}

  /* ---------- TOP BAR ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);position:relative;z-index:5}
  .topbar .brand{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
  .topbar .live{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:var(--steel);text-transform:uppercase}
  .topbar .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(227,28,28,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,28,28,.55)}70%{box-shadow:0 0 0 7px rgba(227,28,28,0)}100%{box-shadow:0 0 0 0 rgba(227,28,28,0)}}

  /* ---------- HERO ---------- */
  .hero{position:relative;padding:96px 0 70px;text-align:center;overflow:hidden}
  .mat{position:absolute;top:50%;left:50%;width:min(120vw,860px);height:min(120vw,860px);transform:translate(-50%,-54%);pointer-events:none;z-index:0}
  .mat .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(246,245,242,.07)}
  .mat .ring.inner{inset:21%;border-color:rgba(246,245,242,.05)}
  .mat .center{position:absolute;top:50%;left:50%;width:38px;height:2px;background:var(--accent);transform:translate(-50%,-50%);opacity:.9}
  .mat-glow{position:absolute;top:50%;left:50%;width:min(120vw,820px);height:min(120vw,820px);transform:translate(-50%,-54%);background:radial-gradient(circle, rgba(227,28,28,.07) 0%, rgba(255,255,255,0) 56%);pointer-events:none;z-index:0}

  .hero-inner{position:relative;z-index:2}
  .hero-eyebrow{justify-content:center;margin-bottom:30px}
  .name{
    font-family:'Anton',sans-serif;font-weight:400;line-height:.84;text-transform:uppercase;
    font-size:clamp(5.2rem,26vw,16rem);letter-spacing:.01em;margin:0 auto;
    background:linear-gradient(180deg,#FFFFFF 0%, #CFCEC9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{margin:26px auto 0;max-width:30ch;color:#D3D2CD;font-size:1.08rem}

  .tape{display:flex;flex-wrap:wrap;justify-content:center;margin:54px auto 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:760px;background:rgba(20,20,23,.5)}
  .tape .cell{flex:1 1 0;min-width:128px;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center}
  .tape .cell:last-child{border-right:none}
  .tape .k{font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.22em;color:var(--steel);text-transform:uppercase}
  .tape .v{font-family:'Anton',sans-serif;font-size:1.7rem;text-transform:uppercase;line-height:1}
  .swatch{width:26px;height:26px;background:#000;border:1px solid var(--chalk);border-radius:5px}

  /* ---------- BANNER ---------- */
  .banner{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 50%, rgba(227,28,28,.08), rgba(20,20,23,0) 70%);text-align:center;padding:64px 28px}
  .banner .be{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .banner .bt{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.98;font-size:clamp(1.9rem,5.2vw,3.3rem);max-width:20ch;margin:0 auto}
  .banner .bs{margin-top:16px;color:#D3D2CD;font-size:1rem}

  /* ---------- THE GO-TO ---------- */
  .move-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px}
  .step{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:28px 24px 26px;overflow:hidden;transition:border-color .3s ease, transform .3s ease, background .3s ease}
  .step:hover{border-color:rgba(227,28,28,.55);transform:translateY(-4px);background:var(--raised-2)}
  .step .num{font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.18em;color:var(--accent);margin-bottom:30px;display:block}
  .step .label{font-family:'Anton',sans-serif;font-size:1.7rem;text-transform:uppercase;line-height:1;display:inline-block}
  .step .note{margin-top:12px;color:var(--steel);font-size:.92rem}
  .step.fake:hover .label{animation:juke .55s ease}
  @keyframes juke{0%{transform:translateX(0)}28%{transform:translateX(-16px)}52%{transform:translateX(-16px)}100%{transform:translateX(0)}}

  /* ---------- IN THE GYM ---------- */
  .gym-row{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;margin-top:14px}
  .spots{display:flex;flex-direction:column;gap:14px}
  .spot{display:flex;align-items:center;justify-content:space-between;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:20px 24px;transition:border-color .3s ease,transform .3s ease}
  .spot:hover{border-color:rgba(227,28,28,.45);transform:translateX(4px)}
  .spot .name-s{font-family:'Anton',sans-serif;font-size:1.45rem;text-transform:uppercase}
  .spot .tag{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.18em;color:var(--steel);text-transform:uppercase}

  /* ---------- ON ROTATION / PLAYER ---------- */
  .crest{display:block;width:clamp(116px,17vw,158px);height:auto;margin:0 auto 26px;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55));border-radius:50%}
  .nowplaying{margin-top:14px;margin-bottom:14px;border:1px solid rgba(227,28,28,.28);border-radius:18px;overflow:hidden;background:linear-gradient(120deg, var(--accent-soft), rgba(20,20,23,0) 62%), var(--raised)}
  .np-hint{margin:0 auto 42px;text-align:center;font-size:.86rem;color:var(--steel)}
  .np-hint a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(227,28,28,.45)}
  .np-head{display:flex;align-items:center;gap:18px;padding:22px 26px}
  .eq{display:flex;align-items:flex-end;gap:4px;height:34px;flex:none}
  .eq span{width:4px;background:var(--accent);border-radius:2px;animation:eq 1.1s ease-in-out infinite;animation-play-state:paused;opacity:.85}
  .nowplaying.playing .eq span{animation-play-state:running;opacity:1}
  .eq span:nth-child(1){height:42%;animation-delay:0s}
  .eq span:nth-child(2){height:90%;animation-delay:.18s}
  .eq span:nth-child(3){height:60%;animation-delay:.34s}
  .eq span:nth-child(4){height:100%;animation-delay:.5s}
  .eq span:nth-child(5){height:52%;animation-delay:.12s}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .np-meta{display:flex;flex-direction:column;gap:3px;margin-right:auto}
  .np-meta .lab{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.2em;color:var(--steel);text-transform:uppercase}
  .np-meta .title{font-family:'Anton',sans-serif;font-size:1.8rem;text-transform:uppercase;line-height:1}
  .np-meta .by{font-size:.92rem;color:#D3D2CD}
  .lyrics{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;transition:color .25s ease,border-color .25s ease}
  .lyrics:hover{color:var(--accent);border-color:rgba(227,28,28,.5)}

  .player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cover{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;cursor:pointer;display:block;background:#000}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8;transition:opacity .3s ease,transform .5s ease}
  .cover:hover img{opacity:.62;transform:scale(1.03)}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,10,11,.55), rgba(10,10,11,.05))}
  .playbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:74px;height:74px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(227,28,28,.5);transition:transform .25s ease}
  .cover:hover .playbtn{transform:translate(-50%,-50%) scale(1.08)}
  .playbtn svg{width:30px;height:30px;margin-left:4px}
  .cover-tag{position:absolute;left:0;right:0;bottom:16px;z-index:2;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:#fff}

  .games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .game{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:26px 22px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .3s ease,transform .3s ease,background .3s ease}
  .game:hover{border-color:rgba(227,28,28,.5);transform:translateY(-4px);background:var(--raised-2)}
  .game .gi{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.16em;color:var(--steel)}
  .game .gn{font-family:'Anton',sans-serif;font-size:1.35rem;text-transform:uppercase;line-height:1.02}
  .game:hover .gi{color:var(--accent)}

  .platform{display:flex;align-items:center;gap:12px;margin-top:26px;justify-content:center}
  .platform .pill{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--chalk);border:1px solid var(--line);border-radius:999px;padding:9px 18px}

  .ach{display:flex;align-items:center;gap:20px;margin-top:30px;background:var(--raised-2);border:1px solid var(--line);border-radius:14px;padding:20px 26px}
  .ach .badge{width:52px;height:52px;border-radius:50%;flex:none;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(227,28,28,.45)}
  .ach .badge svg{width:24px;height:24px}
  .ach .txt{display:flex;flex-direction:column;gap:4px}
  .ach .txt .lab{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.22em;color:var(--steel);text-transform:uppercase}
  .ach .txt .game-c{font-family:'Anton',sans-serif;font-size:1.5rem;text-transform:uppercase;line-height:1}

  /* ---------- FUEL ---------- */
  .fuel-card{margin-top:14px;border:1px solid var(--line);border-radius:18px;padding:48px 44px;background:radial-gradient(circle at 88% 12%, rgba(227,28,28,.14), rgba(20,20,23,0) 42%), var(--raised)}
  .fuel-card .lede{margin-top:16px}

  /* ---------- FOOTER ---------- */
  .foot{border-top:1px solid var(--line);padding:46px 0 58px;text-align:center}
  .foot .sig{font-family:'Anton',sans-serif;font-size:2rem;text-transform:uppercase;letter-spacing:.02em}
  .foot .sub{margin-top:10px}
  .foot .dot{color:var(--accent)}
  .socials{display:flex;justify-content:center;margin-top:24px}
  .social{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.12em;color:var(--chalk);border:1px solid var(--line);border-radius:999px;padding:11px 20px;transition:border-color .25s ease,color .25s ease,background .25s ease}
  .social:hover{border-color:rgba(227,28,28,.6);color:var(--accent);background:var(--accent-soft)}
  .social svg{width:18px;height:18px}

  /* ---------- reveal ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .pre{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.38s}.d4{animation-delay:.55s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- responsive ---------- */
  @media(max-width:760px){
    .section{padding:78px 0}
    .move-grid{grid-template-columns:1fr}
    .games{grid-template-columns:1fr 1fr}
    .gym-row{grid-template-columns:1fr;gap:26px}
    .tape .cell{flex:1 1 40%;min-width:40%}
    .fuel-card{padding:34px 26px}
    .hero{padding:64px 0 50px}
    .np-head{flex-wrap:wrap;gap:14px}
    .lyrics{order:3}
  }
  @media(max-width:430px){
    .games{grid-template-columns:1fr}
    .tape .cell{flex:1 1 100%;min-width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .tape .cell:last-child{border-bottom:none}
    .np-meta{margin-right:0}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
    .reveal{opacity:1;transform:none}
    .pre{opacity:1;transform:none}
  }
</style>
</head>
