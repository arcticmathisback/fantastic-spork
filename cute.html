<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Photo Viewer</title>
  <style>
    /* Prevent text selection and default touch callouts */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none; /* Disables long-press context menu on iOS/Android */
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: #0f0f10;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 90vw;
      max-width: 450px;
      height: 80vh;
      max-height: 650px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      background-color: #1a1a1a;
    }

    /* Display photo as a CSS background image to eliminate the <img> element */
    .photo-layer {
      width: 100%;
      height: 100%;
      background-image: url('photo.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    /* Semi-transparent protective watermark overlay */
    .watermark-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .watermark-text {
      color: rgba(255, 255, 255, 0.25);
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      transform: rotate(-30deg);
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    /* Invisible shield overlay to capture touch/click events */
    .shield-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: rgba(0, 0, 0, 0);
    }

    /* Applied when window loses focus (app switching, tab blur, screen capturing) */
    .blurred {
      filter: blur(40px) brightness(0.2) !important;
      opacity: 0.1 !important;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="card">
    <div class="photo-layer" id="photo"></div>
    <div class="watermark-layer">
      <div class="watermark-text">CONFIDENTIAL • DO NOT COPY</div>
    </div>
    <div class="shield-layer"></div>
  </div>

  <script>
    const photo = document.getElementById('photo');

    // 1. Disable right-click context menu globally
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // 2. Prevent click-and-drag behavior
    document.addEventListener('dragstart', (e) => e.preventDefault());

    // 3. Blur image when window loses focus (app switching, taking desktop clips, multi-tasking)
    window.addEventListener('blur', () => {
      photo.classList.add('blurred');
    });

    window.addEventListener('focus', () => {
      photo.classList.remove('blurred');
    });

    // 4. Block save, print, view-source, and inspect key combos
    document.addEventListener('keydown', (e) => {
      if (
        (e.ctrlKey || e.metaKey) && 
        ['s', 'S', 'u', 'U', 'p', 'P'].includes(e.key)
      ) {
        e.preventDefault();
      }
      if (
        e.key === 'F12' || 
        ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I', 'i', 'C', 'c', 'J', 'j'].includes(e.key))
      ) {
        e.preventDefault();
      }
    });

    // 5. Hide image momentarily if PrintScreen key is pressed
    document.addEventListener('keyup', (e) => {
      if (e.key === 'PrintScreen') {
        photo.classList.add('blurred');
        setTimeout(() => photo.classList.remove('blurred'), 2000);
      }
    });
  </script>
</body>
</html>
